plugins { id 'com.android.application' }

android {
    namespace "cn.uiiconshub.app"
    compileSdk 34

    defaultConfig {
        applicationId "cn.uiiconshub.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions "data"
    productFlavors {
        online {
            dimension "data"
            applicationIdSuffix ".online"
            buildConfigField "String", "START_URL", '"https://sitong-zhang.github.io/ui-icons-hub/"'
            buildConfigField "boolean", "OFFLINE", "false"
            resValue "string", "app_name", "UI 图标库"
        }
        offline {
            dimension "data"
            applicationIdSuffix ".offline"
            buildConfigField "String", "START_URL", '"file:///android_asset/site/index.html"'
            buildConfigField "boolean", "OFFLINE", "true"
            resValue "string", "app_name", "UI 图标库 离线"
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { }
    }

    // assets 里是纯文本 + SVG/PNG，不要压缩，避免 WebView 读取卡顿
    aaptOptions { noCompress "js", "svg", "html", "json", "webmanifest", "png" }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavor = variant.flavorName
            output.outputFileName = "ui-icons-hub-${flavor}-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
