name: Android 调试（临时）

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备 Gradle 8.2
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          gradle -v | head -3
      - name: 构建联网版 APK
        working-directory: android
        run: gradle assembleOnlineDebug --no-daemon --stacktrace 2>&1 | tee /tmp/online.log
      - name: 诊断产物位置
        run: |
          {
            echo "工作目录：$(pwd)"
            echo "== 全盘找 apk（android/ 下） =="
            find android -name "*.apk" -printf "%p  %s\n" 2>/dev/null | head -20
            echo "== build 目录树（深度 5） =="
            find android/app/build -maxdepth 5 -type d 2>/dev/null | head -60
            echo "== outputs 下所有文件 =="
            find android/app/build/outputs -type f 2>/dev/null | head -30
            echo "== 磁盘 =="
            df -h . | tail -2
          } | tee /tmp/diag.log
      - name: 回传诊断（提交到 ci-logs 分支）
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p logs
          cp /tmp/diag.log "logs/android-diag-${{ github.run_id }}.txt"
          tail -n 60 /tmp/online.log > "logs/online-tail-${{ github.run_id }}.txt"
          git add logs
          git commit -m "ci: android 诊断日志 ${{ github.run_id }}" || echo "无改动"
          git push -f origin ci-logs
