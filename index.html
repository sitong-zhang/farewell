<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>网站已永久停止运营服务</title>
<meta name="description" content="本网站已永久停止运营服务，感谢您的陪伴与支持。" />
<style>
  :root {
    --bg-1: #0f1226;
    --bg-2: #1b1f3b;
    --ink: #eef1ff;
    --muted: #aab0d6;
    --accent: #ffd479;
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255, 212, 121, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    line-height: 1.7;
  }
  .card {
    width: min(640px, 100%);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    animation: rise 0.9s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .mark {
    width: 64px; height: 64px;
    margin: 0 auto 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(255, 212, 121, 0.14);
    border: 1px solid rgba(255, 212, 121, 0.4);
  }
  .mark svg { width: 30px; height: 30px; }
  h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .sub {
    margin-top: 10px;
    color: var(--accent);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 600;
  }
  .divider {
    width: 48px; height: 1px;
    background: var(--line);
    margin: 26px auto;
  }
  p.body {
    color: var(--muted);
    font-size: 15px;
    text-align: left;
  }
  p.body + p.body { margin-top: 14px; }
  .meta {
    margin-top: 28px;
    font-size: 13px;
    color: rgba(170, 176, 214, 0.7);
  }
  .meta b { color: var(--ink); font-weight: 600; }
  footer {
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: rgba(170, 176, 214, 0.6);
  }
  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd479" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7.5-4.6-9.5-9.2C1 8.4 2.7 5 6 5c2 0 3.2 1.2 4 2.4C10.8 6.2 12 5 14 5c3.3 0 5 3.4 3.5 6.8C19.5 16.4 12 21 12 21z"/>
      </svg>
    </div>

    <h1>网站已永久停止运营服务</h1>
    <div class="sub">感谢您的陪伴与支持</div>

    <div class="divider"></div>

    <p class="body">
      亲爱的朋友：
    </p>
    <p class="body">
      我们怀着不舍的心情通知您，本网站已<strong>永久停止运营</strong>，相关服务不再提供，历史数据也不再保留。做出这个决定并不容易，但这是经过慎重考虑后的结果。
    </p>
    <p class="body">
      自上线以来，是每一位来访者让这里有了意义。无论是匆匆一瞥，还是长情相伴，我们都铭记于心。虽然站点停下了，但曾经的同行与善意不会被遗忘。
    </p>
    <p class="body">
      如果您仍在寻找类似的服务，建议前往官方应用商店或可信平台获取最新替代品。也请留意个人信息安全，谨慎对待任何以本站名义发出的后续通知。
    </p>

    <div class="meta">
      服务终止时间：<b>2026 年</b>　·　本页为停运公告，长期保留
    </div>

    <footer>
      山水有相逢，后会有期。愿前路皆坦途。
    </footer>
  </main>
</body>
</html>
